name: Scheduled task

on:
  schedule:
    - cron: '55 1-23/2 * * *'
  workflow_dispatch: # 手动触发

jobs:
  generated_file_and_push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'

      - name: Build Go project
        run: go build -o myapp

      - name: Run Go programs
        run: |
          ./myapp 

      - name: Configure Git
        run: |
          git config user.email "979238315@qq.com"
          git config user.name "actions cron"

      - name: Add and commit new files
        run: |
          current_time=$(date +"%Y-%m-%d %H:%M:%S")
          git add content/post/ 
          git commit -m "Add generated files - ${current_time}" || echo "No changes to commit"

      - name: Push changes
        uses: ad-m/github-push-action@v1.3.0
        with:
          token: ${{ secrets.GIT_TOKEN }}
          branch: main
          force: true

  deploy:
    runs-on: ubuntu-latest
    needs: generated_file_and_push
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      # hugo mod 依赖 Go 工具链，显式安装避免 runner 预装版本低于 go.mod 要求
      - name: Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.27.4'

      # Hugo v0.170.0 起移除了 extended 构建和内置 LibSass，Sass 全部改由 Dart Sass 处理，
      # 因此不再传 extended: true，改为显式安装 Dart Sass（主题 stack v4 的 toCSS 依赖它）。
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3.2.1
        with:
          hugo-version: 'latest'

      - name: Setup Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      # 注意装的是 sass-embedded：Hugo 0.170+ 通过 `sass --embedded` 协议调用，
      # 纯 JS 的 sass 包不支持该参数，会导致 "unexpected EOF" 构建失败。
      - name: Install Dart Sass
        run: npm install -g sass-embedded@1.108.2

      - name: download themes
        run: mkdir -p themes && git clone --branch v4.0.3 https://github.com/CaiJimmy/hugo-theme-stack.git themes/hugo-theme-stack

      - name: init mod
        run: hugo mod get && hugo mod tidy

      - name: Build site
        run: hugo --config ./config.yaml
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4.1.0
        with:
          github_token: ${{ secrets.GIT_TOKEN }}
          publish_dir: ./docs